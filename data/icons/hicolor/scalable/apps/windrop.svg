<?xml version="1.0" encoding="UTF-8"?>
<!--
  WinDrop's own icon: a Windows program dropping into its own private window.
  Installed as `windrop` in the hicolor theme, which is also the name the core
  falls back to for applications whose icon cannot be extracted (see
  `windrop_core::icons::FALLBACK_ICON_NAME`).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#8b3dff"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#background)"/>

  <!-- The program, falling in. -->
  <path d="M64 14 v20" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M54 27 l10 12 10 -12" stroke="#ffffff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- The private window it lands in: a title bar, two traffic lights, one pane. -->
  <rect x="24" y="48" width="80" height="60" rx="9"
        fill="#ffffff" fill-opacity="0.16"/>
  <rect x="24" y="48" width="80" height="60" rx="9"
        stroke="#ffffff" stroke-width="5" fill="none"/>
  <path d="M24 65 h80" stroke="#ffffff" stroke-width="5"/>
  <circle cx="36" cy="56.5" r="3.2" fill="#ffffff"/>
  <circle cx="47" cy="56.5" r="3.2" fill="#ffffff"/>
</svg>
